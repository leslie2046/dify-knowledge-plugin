identity:
  name: get_segment
  author: leslie2046
  label:
    en_US: Get Document Segment
    zh_Hans: 获取文档分段详情
description:
  human:
    en_US: Read the full details of a segment by ID, including content, Q&A answer,
      indexing status, attachments and child chunks when returned by Dify. Obtain
      segment_id from list_segments or retrieve_chunks.
    zh_Hans: 按分段 ID 读取详情，包括正文、问答答案、索引状态，以及 Dify 返回的附件和子分段。分段 ID 可通过 list_segments
      或 retrieve_chunks 获取。
  llm: Read the full details of a segment by ID, including content, Q&A answer, indexing
    status, attachments and child chunks when returned by Dify. Obtain segment_id
    from list_segments or retrieve_chunks.
parameters:
- name: dataset_id
  type: string
  required: true
  form: llm
  label:
    en_US: Dataset ID
    zh_Hans: 知识库 ID
  human_description:
    en_US: Knowledge base ID. Obtain it from list_datasets.
    zh_Hans: 知识库 ID，可通过 list_datasets 获取。
  llm_description: Knowledge base ID. Obtain it from list_datasets.
- name: document_id
  type: string
  required: true
  form: llm
  label:
    en_US: Document ID
    zh_Hans: 文档 ID
  human_description:
    en_US: Document ID. Obtain it from list_documents or retrieve_chunks.
    zh_Hans: 文档 ID，可通过 list_documents 或 retrieve_chunks 获取。
  llm_description: Document ID. Obtain it from list_documents or retrieve_chunks.
- name: segment_id
  type: string
  required: true
  form: llm
  label:
    en_US: Segment ID
    zh_Hans: 分段 ID
  human_description:
    en_US: Segment ID from list_segments or retrieve_chunks.
    zh_Hans: 分段 ID，可通过 list_segments 或 retrieve_chunks 获取。
  llm_description: Segment ID from list_segments or retrieve_chunks.
output_schema:
  type: object
  properties:
    dataset_id:
      type: string
    document_id:
      type: string
    doc_form:
      type: string
    result:
      type: object
      properties:
        id:
          type: string
        segment_id:
          type: string
        dataset_id:
          type: string
        document_id:
          type: string
        position:
          type: integer
        content:
          type: string
        answer:
          type: string
        status:
          type: string
        enabled:
          type: boolean
        word_count:
          type: integer
        tokens:
          type: integer
        keywords:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            type: object
        child_chunks:
          type: array
          items:
            type: object
extra:
  python:
    source: tools/get_segment.py
